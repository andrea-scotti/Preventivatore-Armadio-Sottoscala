<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preventivatore Scale Italia - Configuratore Avanzato</title>
    <link rel="stylesheet" href="style.css">
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.150.1/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.150.1/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <div id="app-container">
        <div id="sidebar">
            <div style="font-weight: bold; font-size: 20px; margin-bottom: 20px; color: #333;">SCALE ITALIA</div>
            
            <section>
                <h3>PARAMETRI SCALA</h3>
                <div class="input-group">
                    <label>Tipo struttura</label>
                    <select id="tipoStruttura">
                        <option value="Lineare" selected>Lineare</option>
                        <option value="Cremagliera">Cremagliera</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Tipo di sbarco</label>
                    <select id="tipoSbarco">
                        <option value="Pari solaio" selected>Pari solaio</option>
                        <option value="Sotto solaio">Sotto solaio</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Pedata (mm)</label>
                    <input type="number" id="pedata" value="250" min="190" max="280" step="10">
                </div>
                <div class="input-group">
                    <label>Pedata Ultimo Gradino (mm)</label>
                    <input type="number" id="pedataUltimo" value="250" min="190" max="1000" step="10">
                </div>
                <div class="input-group">
                    <label>Alzata (mm)</label>
                    <input type="number" id="alzata" value="180">
                </div>
                <div class="input-group">
                    <label>N° pedate (Totali)</label>
                    <input type="number" id="numeroPedate" value="10" min="4" max="20" step="1">
                </div>
                <div class="input-group">
                    <label>Gradino di inizio armadio (dal basso)</label>
                    <input type="number" id="gradinoInizio" value="3" min="3" step="1">
                </div>
            </section>

            <section>
                <h3>FINITURE</h3>
                <div class="input-group">
                    <label>Colore interno</label>
                    <select id="coloreInterno">
                        <option value="#F0ECE1" selected>Bianco 0B01</option>
                        <option value="#d4c8ba">Cashmere U6933</option>
                        <option value="#968068">Praline U3062</option>
                        <option value="#5d5d5f">Antracite U164</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Colore esterno (Ante)</label>
                    <select id="coloreEsterno">
                        <option value="#0A0A0D">9005 nero intenso</option>
                        <option value="#5A3A29">8011 marrone noce</option>
                        <option value="#383E42">7016 grigio antracite</option>
                        <option value="#F0ECE1" selected>9010 bianco puro</option>
                        <option value="#756f61">7006 grigio beige</option>
                        <option value="#A5A5A4">9006 alluminio brillante</option>
                    </select>
                </div>
            </section>

            <section>
                <h3>ACCESSORI</h3>
                <div id="accessori-container"></div>
            </section>
        </div>

        <div id="canvas-container">
            <div id="overlay-controls">
                <label class="checkbox-container">
                    <input type="checkbox" id="showAnte" checked>
                    <span class="checkmark"></span>
                    Visualizza Ante
                </label>
            </div>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
